name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v7.0.1"

      - name: "Adjust version number"
        shell: "bash"
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"  # tag v0.1.0 -> version 0.1.0
          yq -i -o json ".version=\"${version}\"" \
            "${{ github.workspace }}/custom_components/dmi_weather/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/dmi_weather"
          zip dmi_weather.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ github.workspace }}/custom_components/dmi_weather/dmi_weather.zip
